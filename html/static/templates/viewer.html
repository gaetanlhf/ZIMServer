{{define "title"}}{{.ArchiveTitle}}{{end}}

{{define "head"}}
{{if .FaviconURL}}
<link rel="icon" type="{{.FaviconType}}" href="{{.FaviconURL}}">
{{end}}
{{end}}

{{define "body"}}
<div class="viewer-page">
    <header>
        <div class="viewer-header">
            <a href="/" class="icon-btn" title="{{T .Lang "viewer.back_to_home"}}">
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                    <path d="m3.86 8.753 5.482 4.796c.646.566 1.658.106 1.658-.753V3.204a1 1 0 0 0-1.659-.753l-5.48 4.796a1 1 0 0 0 0 1.506z"/>
                </svg>
            </a>
            <a href="#" onclick="loadHome(); return false;" class="archive-info" id="archiveInfo" title="{{T .Lang "viewer.go_to_archive_home"}}">
                <div class="archive-icon-container">
                    <img id="archiveIcon" src="{{.IllustrationURL}}" alt="{{.ArchiveTitle}}"
                         onerror="this.onerror=null; this.parentElement.classList.add('has-fallback-icon');">
                    <div class="spinner">
                        <div class="spinner-border"></div>
                    </div>
                </div>
                <span class="archive-name">{{.ArchiveTitle}}</span>
            </a>
            <div class="spacer"></div>
            {{if .HasIndex}}
            <button class="icon-btn random-btn" id="randomBtn" onclick="loadRandom()" title="{{T .Lang "viewer.random_article"}}">
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M3 0a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V3a3 3 0 0 0-3-3zm2.5 4a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m8 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0M12 13.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3M5.5 12a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0M8 9.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3"/>
                </svg>
            </button>
            <div class="viewer-search" id="searchContainer">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                </svg>
                <input type="text" id="searchInput" placeholder="{{T .Lang "viewer.search"}}" oninput="searchArticles(this.value)" onfocus="showSearchResults()">
                <button class="clear-search" id="clearSearchBtn" onclick="clearSearch()">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
                <div class="search-loading" id="searchLoading">
                    <div class="search-loading-spinner"></div>
                </div>
            </div>
            {{end}}
        </div>
    </header>

    <div class="search-results" id="searchResults"></div>

    <div class="iframe-container">
        {{if .IsCatch}}
        <iframe id="contentFrame" src="{{.CatchSrc}}"></iframe>
        {{else}}
        <iframe id="contentFrame" src="/content/{{.ArchiveName}}/{{.EntryPath}}"></iframe>
        {{end}}
    </div>

    <div id="toastContainer" class="toast-container"></div>
</div>
{{end}}

{{define "scripts"}}
<script>
    window.i18n = {
        no_results_found: "{{T .Lang "viewer.no_results_found"}}",
        connection_lost: "{{T .Lang "viewer.connection_lost"}}"
    };
</script>
<script src="/assets/js/viewer.js"></script>
<script>
    init('{{.ArchiveName}}');
</script>
{{end}}
